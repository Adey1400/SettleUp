server:
  port: 8083

spring:
  application:
    name: expense-service
  
  datasource:
    url: jdbc:postgresql://localhost:5432/settleup_expense_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:secret123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: localhost
      port: 6379
      
application:
  security:
    jwt:
      secret: ${JWT_SECRET}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true